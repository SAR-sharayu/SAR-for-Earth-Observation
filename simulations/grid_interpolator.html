/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */

  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);

  --positive-container: var(--lumi-sys-color--positive-container, #daf9d4);
  --error: var(--lumi-sys-color--error, #de2d29);

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);
  min-height: 36px;
  padding: 6px 16px;
  font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif);
  font-size: 13px;
  font-weight: 500;
  line-height: 18px;
  color: var(--on-surface, #000000);
  background-color: var(--surface-bright, #ffffff);
  border: 1px solid var(--stroke-default, #e3e3e3);
  border-radius: var(--lumi-sys-shape--full, 999px);
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
button:hover {
  background-color: var(--surface-container-high, #e6e6e6);
}
button.active, button.is-active, button.selected, button.is-selected, button[aria-pressed="true"], button[aria-selected="true"] {
  background-color: var(--accent-container, #dcf1ff);
  color: var(--accent-fixed, #3186ff);
  border-color: transparent;
}

.lumi-btn, [class^="lumi-btn-"], [class*=" lumi-btn-"] { display: inline-flex; align-items: center; justify-content: center; gap: var(--lumi-sys-spacing--s, 8px); min-height: 40px; padding: 0px 20px; font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif); font-size: 14px; font-weight: 500; line-height: 20px; border-radius: var(--lumi-sys-shape--full, 999px); border: 1px solid var(--lumi-sys-color--stroke-default, #e3e3e3); cursor: pointer; user-select: none; transition: background-color 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s; text-decoration: none; box-sizing: border-box; white-space: nowrap; }
.lumi-btn:active, .lumi-btn.is-pressed, [class^="lumi-btn-"]:active, [class*=" lumi-btn-"]:active { transform: scale(0.98); }
.lumi-btn--tonal, .lumi-btn-tonal, .lumi-btn--secondary, .lumi-btn-secondary, [class^="lumi-btn-"], [class*=" lumi-btn-"] { background-color: var(--lumi-sys-color--surface-bright, #ffffff); color: var(--lumi-sys-color--on-surface-default, #000000); }

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

<body>
  <div class="widget-container">

    <div class="control-row">

        <button class="lumi-segmented-btn" id="btn-mode-2" onclick="setMode('process')">Interpolation Process</button>
        <button class="lumi-segmented-btn" id="btn-mode-3" onclick="setMode('final')">Final Pixel Grid</button>
      </div>
    </div>

    <div class="grid-inspector-layout">
      <div class="viewport-box">
        <svg id="gridSvg" viewBox="0 0 310 310" style="width: 100%; max-width: 310px; height: auto; display: block;">
          <!-- SVG content dynamically injected -->
        </svg>
      </div>

      <div class="inspector-card" id="inspectorCard">
        <div class="inspector-header">
          <span class="lumi-label-m lumi-emphasized">Pixel Inspector</span>
          <span class="badge-tag" id="targetCoordBadge">Pixel (7, 7)</span>
        </div>

        <div id="inspectorBody" style="display: flex; flex-direction: column; gap: var(--spacing-s);">
          <!-- Content populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // State Model
    const TIE_GRID_SIZE = 3;
    const PIXEL_GRID_SIZE = 15;
    
    // 3x3 Calibration Factors (Sparse Tie-Points)
    const TIE_VALUES = [
      [10.0, 25.0, 40.0],
      [30.0, 55.0, 80.0],
      [50.0, 85.0, 120.0]
    ];

    // Grid Mapping: Tie points sit at pixel indices 0, 7, 14
    const TIE_INDICES = [0, 7, 14];

    let state = {
      mode: 'tie-only', // 'tie-only' | 'process' | 'final'
      hoverRow: 4,
      hoverCol: 4
    };

    function getCssVar(name) {
      if (!name) return '';
      const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim() || '';
    }

    // Convert interpolated value (10 to 120) to color tint
    function getValueColor(val) {
      const min = 10.0;
      const max = 120.0;
      const t = Math.max(0, Math.min(1, (val - min) / (max - min)));
      
      // Interpolate from light accent blue (e.g., hsl(205, 80%, 90%)) to deep primary blue (hsl(215, 85%, 35%))
      const hue = 210;
      const sat = Math.round(70 + t * 20);
      const light = Math.round(88 - t * 50);
      return `hsl(${hue}, ${sat}%, ${light}%)`;
    }

    function calculateInterpolation(r, c) {
      // Find sector
      let rSector = r < 7 ? 0 : 1;
      let cSector = c < 7 ? 0 : 1;

      let r0 = TIE_INDICES[rSector];
      let r1 = TIE_INDICES[rSector + 1];
      let c0 = TIE_INDICES[cSector];
      let c1 = TIE_INDICES[cSector + 1];

      let v = (r - r0) / (r1 - r0);
      let u = (c - c0) / (c1 - c0);

      let q11 = TIE_VALUES[rSector][cSector];       // Top-Left
      let q12 = TIE_VALUES[rSector][cSector + 1];   // Top-Right
      let q21 = TIE_VALUES[rSector + 1][cSector];   // Bottom-Left
      let q22 = TIE_VALUES[rSector + 1][cSector + 1]; // Bottom-Right

      let vTop = (1 - u) * q11 + u * q12;
      let vBot = (1 - u) * q21 + u * q22;
      let finalVal = (1 - v) * vTop + v * vBot;

      return {
        r0, r1, c0, c1,
        u, v,
        rSector, cSector,
        q11, q12, q21, q22,
        vTop, vBot,
        finalVal
      };
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll('.lumi-segmented-btn').forEach(btn => btn.classList.remove('is-selected'));
      if (mode === 'tie-only') document.getElementById('btn-mode-1').classList.add('is-selected');
      if (mode === 'process') document.getElementById('btn-mode-2').classList.add('is-selected');
      if (mode === 'final') document.getElementById('btn-mode-3').classList.add('is-selected');
      updateViz();
    }

    function renderGridSvg() {
      const svg = document.getElementById('gridSvg');
      if (!svg) return;

      const cellSize = 18;
      const pad = 20; // Margin around grid
      const interp = calculateInterpolation(state.hoverRow, state.hoverCol);

      let html = '';

      // Render 15x15 Pixel Grid
      for (let r = 0; r < PIXEL_GRID_SIZE; r++) {
        for (let c = 0; c < PIXEL_GRID_SIZE; c++) {
          const x = pad + c * cellSize;
          const y = pad + r * cellSize;
          const pixelCalc = calculateInterpolation(r, c);
          const isHovered = (r === state.hoverRow && c === state.hoverCol);

          let fill = getCssVar('--surface-bright');
          let stroke = getCssVar('--stroke-default');
          let strokeWidth = '0.5';
          let opacity = '1';

          if (state.mode === 'tie-only') {
            opacity = '0.25';
            fill = getCssVar('--surface-container');
          } else if (state.mode === 'final') {
            fill = getValueColor(pixelCalc.finalVal);
            stroke = 'rgba(0,0,0,0.08)';
          } else if (state.mode === 'process') {
            // Check if in active sector bounding box
            const inSector = (r >= interp.r0 && r <= interp.r1 && c >= interp.c0 && c <= interp.c1);
            if (inSector) {
              fill = getValueColor(pixelCalc.finalVal);
              opacity = '0.7';
            } else {
              opacity = '0.15';
              fill = getCssVar('--surface-container');
            }
          }

          if (isHovered && state.mode !== 'tie-only') {
            stroke = getCssVar('--primary');
            strokeWidth = '2';
            opacity = '1';
          }

          html += `<rect class="pixel-rect" x="${x}" y="${y}" width="${cellSize}" height="${cellSize}"
                    fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" opacity="${opacity}"
                    onmouseover="onPixelHover(${r}, ${c})" />`;
        }
      }

      // Render Process Bounding Box Highlights
      if (state.mode === 'process' || state.mode === 'final') {
        const bx = pad + interp.c0 * cellSize;
        const by = pad + interp.r0 * cellSize;
        const bw = (interp.c1 - interp.c0 + 1) * cellSize;
        const bh = (interp.r1 - interp.r0 + 1) * cellSize;

        html += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}"
                  fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="3 3" pointer-events="none" />`;

        // Draw crosshair to hovered pixel
        const px = pad + state.hoverCol * cellSize + cellSize / 2;
        const py = pad + state.hoverRow * cellSize + cellSize / 2;
        
        html += `<circle cx="${px}" cy="${py}" r="3" fill="var(--primary)" pointer-events="none"/>`;
      }

      // Render 3x3 Tie Point Overlay Nodes
      for (let tr = 0; tr < TIE_GRID_SIZE; tr++) {
        for (let tc = 0; tc < TIE_GRID_SIZE; tc++) {
          const pr = TIE_INDICES[tr];
          const pc = TIE_INDICES[tc];
          const cx = pad + pc * cellSize + cellSize / 2;
          const cy = pad + pr * cellSize + cellSize / 2;
          const val = TIE_VALUES[tr][tc];

          const isBounding = (tr >= interp.rSector && tr <= interp.rSector + 1 && tc >= interp.cSector && tc <= interp.cSector + 1);
          const isHighlighted = (state.mode === 'process' && isBounding) || state.mode === 'tie-only';

          const nodeColor = isHighlighted ? 'var(--primary)' : 'var(--outline)';
          const nodeRadius = isHighlighted ? 7 : 5;

          html += `<circle cx="${cx}" cy="${cy}" r="${nodeRadius}" fill="var(--surface-bright)" stroke="${nodeColor}" stroke-width="2" class="tie-node" />`;
          html += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="${nodeColor}" class="tie-node" />`;

          // Value badge label
          html += `<text x="${cx}" y="${cy - 9}" font-family="var(--ff-mono)" font-size="12" font-weight="600" 
                    fill="var(--on-surface)" text-anchor="middle" pointer-events="none">${val.toFixed(0)}</text>`;
        }
      }

      if (svg) svg.innerHTML = html;
    }

    function renderInspector() {
      const card = document.getElementById('inspectorBody');
      const badge = document.getElementById('targetCoordBadge');
      if (!card || !badge) return;

      const r = state.hoverRow;
      const c = state.hoverCol;
      const calc = calculateInterpolation(r, c);

      if (badge) badge.textContent = `Pixel (${r}, ${c})`;

      if (state.mode === 'tie-only') {
        if (card) card.innerHTML = `
          <p class="lumi-body-s" style="margin:0; color: var(--on-surface-variant);">
            The coarse grid consists of 9 calibration tie-points. Select <b>Interpolation Process</b> or <b>Final Pixel Grid</b> to calculate dense pixel values.
          </p>
          <div style="margin-top: var(--spacing-xs);">
            <span class="lumi-label-s" style="display:block; margin-bottom: 6px;">Tie-Point Calibration Matrix:</span>
            <table class="tie-point-table">
              <tr><th>Row / Col</th><th>C=0</th><th>C=7</th><th>C=14</th></tr>
              <tr><th>R=0</th><td>10.0</td><td>25.0</td><td>40.0</td></tr>
              <tr><th>R=7</th><td>30.0</td><td>55.0</td><td>80.0</td></tr>
              <tr><th>R=14</th><td>50.0</td><td>85.0</td><td>120.0</td></tr>
            </table>
          </div>
        `;
        return;
      }

      const uPct = (calc.u * 100).toFixed(0);
      const vPct = (calc.v * 100).toFixed(0);

      if (card) card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="lumi-body-s">Bounding Tie-Points:</span>
          <span class="lumi-code" style="font-size: 12px; color: var(--primary);">u = ${calc.u.toFixed(2)}, v = ${calc.v.toFixed(2)}</span>
        </div>

        <table class="tie-point-table">
          <tr>
            <th>Corner</th>
            <th>Position</th>
            <th>Tie Value</th>
          </tr>
          <tr>
            <td>Q<sub>11</sub> (Top-Left)</td>
            <td>(${calc.r0}, ${calc.c0})</td>
            <td class="highlighted">${calc.q11.toFixed(1)}</td>
          </tr>
          <tr>
            <td>Q<sub>12</sub> (Top-Right)</td>
            <td>(${calc.r0}, ${calc.c1})</td>
            <td class="highlighted">${calc.q12.toFixed(1)}</td>
          </tr>
          <tr>
            <td>Q<sub>21</sub> (Bottom-Left)</td>
            <td>(${calc.r1}, ${calc.c0})</td>
            <td class="highlighted">${calc.q21.toFixed(1)}</td>
          </tr>
          <tr>
            <td>Q<sub>22</sub> (Bottom-Right)</td>
            <td>(${calc.r1}, ${calc.c1})</td>
            <td class="highlighted">${calc.q22.toFixed(1)}</td>
          </tr>
        </table>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 2px;">
          <span class="lumi-label-s">Bilinear Equation:</span>
          <div class="math-block">
            V<sub>top</sub> = (1-${calc.u.toFixed(2)})&middot;${calc.q11} + ${calc.u.toFixed(2)}&middot;${calc.q12} = <b>${calc.vTop.toFixed(1)}</b><br>
            V<sub>bot</sub> = (1-${calc.u.toFixed(2)})&middot;${calc.q21} + ${calc.u.toFixed(2)}&middot;${calc.q22} = <b>${calc.vBot.toFixed(1)}</b><br>
            V(${r},${c}) = (1-${calc.v.toFixed(2)})&middot;${calc.vTop.toFixed(1)} + ${calc.v.toFixed(2)}&middot;${calc.vBot.toFixed(1)}<br>
            <span style="color: var(--primary); font-weight: 600;">Result = ${calc.finalVal.toFixed(2)}</span>
          </div>
        </div>
      `;
    }

    function onPixelHover(r, c) {
      state.hoverRow = r;
      state.hoverCol = c;
      updateViz();
    }

    function updateViz() {
      try {
        renderGridSvg();
        renderInspector();
      } catch (err) {
        showErrorFallback('inspectorCard', err);
      }
    }

    function showErrorFallback(containerId, error) {
      console.error(`Render error in ${containerId}:`, error);
      const container = document.getElementById(containerId);
      if (container) {
        if (container) container.innerHTML = `
          <div style="padding: var(--spacing-l); background: var(--surface-dim); border-radius: var(--r-m); text-align: center; color: var(--on-surface-variant);">
            <p class="lumi-body-m" style="margin:0;">Data Unavailable</p>
            <p class="lumi-body-s" style="margin: 4px 0 0 0;">Unable to render grid interpolation view.</p>
          </div>`;
      }
    }

    // Initial first-frame trigger
    updateViz();

    // Theme and iframe resize handling
    const applyTheme = t => { 
      document.documentElement.setAttribute('data-theme', t); 
      if (typeof updateViz === 'function') updateViz(); 
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => { 
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme); 
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
